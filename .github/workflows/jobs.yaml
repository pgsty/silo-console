# @format

name: Workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Historical test recipes call this MINIO_VERSION. The release gate uses the
  # maintained SILO server.
  MINIO_VERSION: silo-test:${{ github.run_id }}
  # The SILO candidate used for the Console release acceptance campaign.
  SILO_TEST_REVISION: 263ee0510da51c555b7257bbe504b22355cac4b0

jobs:
  compile-silo:
    name: Build the coordinated SILO fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: pgsty/silo
          ref: ${{ env.SILO_TEST_REVISION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the Server binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/silo-fixture"
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/silo-fixture/silo" .
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/silo-fixture/silo
          key: ${{ runner.os }}-silo-fixture-${{ github.run_id }}

  lint-job:
    name: Checking Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run checks
        run: |
          make verifiers

  upstream-pkg-compat:
    name: Best-effort build with upstream minio/mc graph
    # Compatibility with unmodified upstream components is useful evidence but
    # is not part of the supported SILO release graph.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Remove the maintained mc replacement and probe compatibility
        # hack/upstream-floor.sh models an embedder that does not copy the mc
        # replacement.
        run: hack/upstream-floor.sh

  downstream-embedder-compat:
    name: Build a minimal embedder from the README replacement block
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify the README block against go.mod
        run: go run ./hack/replacements check
      - name: Build an embedder that copies the README block verbatim
        # hack/embedder-compat.sh feeds the published README text into a
        # scratch module.
        run: hack/embedder-compat.sh

  semgrep-static-code-analysis:
    name: "semgrep checks"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install and run Semgrep with the runner's Python
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --require-hashes -r .github/requirements/semgrep.txt
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --config semgrep.yaml web-app --error --metrics off
          python3 hack/check-ci-contract.py

  ui-assets:
    name: "React Code Has No Warnings & Prettified"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: web-app/yarn.lock
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: assets-cache
        name: Assets Cache
        with:
          path: |
            ./web-app/build/
          key: ${{ runner.os }}-assets-${{ github.run_id }}
      - name: Install Dependencies
        working-directory: ./web-app
        run: |
          yarn install --immutable
      - name: Check for Warnings in build output
        working-directory: ./web-app
        run: |
          ./check-warnings.sh
      - name: Check JavaScript bundle budgets
        working-directory: ./web-app
        run: yarn check:bundle
      - name: Check if Files are Prettified
        working-directory: ./web-app
        run: |
          ./check-prettier.sh
      - name: Check for dead code
        working-directory: ./web-app
        run: |
          ./check-deadcode.sh
      - name: Set up Go for the credits check
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the frontend section of CREDITS
        # The production dependency closure is read from node_modules, so this
        # check lives where the immutable install just happened.
        run: go run ./hack/credits check --frontend

  release-artifacts:
    name: Release artifacts carry license, notice, credits and exact provenance
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          install-only: true
      - name: Install Syft for release SBOM validation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Build a snapshot and verify every artifact
        run: hack/verify-release-artifacts.sh snapshot
      - name: Compare source container metadata and frontend assets
        run: hack/check-container-equivalence.sh
      - name: Exercise Linux package install, upgrade, shutdown and certificate ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/check-package-lifecycle.sh

  reproducible-artifacts:
    name: Reproduce release artifacts in independent checkouts
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          install-only: true
      - name: Install Syft for release SBOM validation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Rebuild the same commit twice in independent checkouts
        run: hack/check-reproducible.sh

  swagger-codegen:
    name: "Check for uncommitted changes through Swagger Codegen Changes."
    needs:
      - lint-job
      - ui-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: web-app/yarn.lock
      - name: Install NPM Dependencies
        working-directory: ./web-app
        run: |
          yarn install --immutable
      - name: Install go-swagger
        run: |
          go tool swagger version
      - name: Validate swagger.yml
        run: go tool swagger validate ./swagger.yml
      - name: Run Swagger Codegen
        run: make swagger-gen

      - name: Check for uncommitted changes
        id: git-status
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Codegen modified files. Please run "make swagger-gen" and commit the changes first:"
            git status --porcelain
            echo "##### Git Diff: #####"
            git --no-pager diff
            exit 1
          else
            echo "No changes detected after codegen."
          fi

  compile-binary:
    name: Build Console
    needs:
      - compile-silo
      - lint-job
      - downstream-embedder-compat
      - ui-assets
      - semgrep-static-code-analysis
      - swagger-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Console Binary Cache
        with:
          path: |
            ./console
          key: ${{ runner.os }}-binary-${{ github.run_id }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: assets-cache
        name: Assets Cache
        with:
          path: |
            ./web-app/build/
          key: ${{ runner.os }}-assets-${{ github.run_id }}
      - name: Run checks
        run: |
          make console

  test-nginx-subpath:
    name: Test Subpath with Nginx
    needs:
      - compile-binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: web-app/yarn.lock
      - name: Install locked browser dependencies
        working-directory: ./web-app
        run: |
          yarn install --immutable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Console Binary Cache
        with:
          path: |
            ./console
          key: ${{ runner.os }}-binary-${{ github.run_id }}

      - name: Prepare the coordinated SILO fixture
        uses: ./.github/actions/test-silo

      - name: Start Console, MinIO and Nginx
        run: |
          (CONSOLE_SUBPATH=/console/subpath ./console server ) & (make test-initialize-minio-nginx)

      - name: Install the pinned and checksum-verified Firefox
        run: bash hack/install-ci-firefox.sh

      - name: Run TestCafe Tests
        run: ./web-app/node_modules/.bin/testcafe "firefox:headless" web-app/tests/subpath-nginx/ --skip-js-errors --screenshots "path=testcafe-screenshots,takeOnFails=true,pathPattern=\${FIXTURE}/\${TEST}.png"
      - name: Upload TestCafe screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testcafe-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: testcafe-screenshots
          if-no-files-found: warn

      - name: Clean up docker
        if: always()
        run: |
          make cleanup-minio-nginx

  permissions-tests:
    name: Permissions Tests Part ${{ matrix.suite }}
    needs: compile-binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ["1", "2", "3", "4", "5", "6", "7", "8", "A", "B"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: web-app/yarn.lock
      - name: Install browser dependencies
        working-directory: web-app
        run: yarn install --immutable
      - name: Restore Console
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./console
          key: ${{ runner.os }}-binary-${{ github.run_id }}
      - uses: ./.github/actions/test-silo
      - name: Initialize users and policies, then start Console
        run: |
          make initialize-permissions
          ./console server > "$RUNNER_TEMP/console.log" 2>&1 &
      - name: Install Firefox
        run: bash hack/install-ci-firefox.sh
      - name: Run permission tests
        env:
          SUITE: ${{ matrix.suite }}
        run: ./web-app/node_modules/.bin/testcafe "firefox:headless" "web-app/tests/permissions-$SUITE/" --skip-js-errors --screenshots "path=testcafe-screenshots,takeOnFails=true,pathPattern=\${FIXTURE}/\${TEST}.png"
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permissions-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: |
            testcafe-screenshots
            ${{ runner.temp }}/console.log

  test-pkg-on-go:
    name: Test Go packages
    needs:
      - lint-job
      - ui-assets
      - semgrep-static-code-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run checks
        run: |
          make test-pkg

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-pkg
        name: Coverage Cache Pkg
        with:
          path: |
            ./pkg/coverage/
          key: ${{ runner.os }}-coverage-pkg-2-${{ github.run_id }}

  test-api-on-go:
    name: Test Go API
    needs:
      - lint-job
      - ui-assets
      - semgrep-static-code-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run checks
        run: |
          make test

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-api
        name: Coverage Cache API
        with:
          path: |
            ./api/coverage/
          key: ${{ runner.os }}-coverage-api-2-${{ github.run_id }}

  b-integration-tests:
    name: Integration Tests with Pinned SILO
    needs: compile-binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Console Binary Cache
        with:
          path: |
            ./console
          key: ${{ runner.os }}-binary-${{ github.run_id }}
      - name: Prepare the coordinated SILO fixture
        uses: ./.github/actions/test-silo

      - name: Test the Console container with SILO
        run: |
          TAG="docker.io/pgsty/silo-console:dev"
          docker build --no-cache -t "$TAG" -f Dockerfile.release .
          make test-integration TAG="$TAG"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache
        name: Coverage Cache
        with:
          path: |
            ./integration/coverage/
          key: ${{ runner.os }}-coverage-2-${{ github.run_id }}

  replication:
    name: Site Replication Test
    needs: compile-binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare the coordinated SILO fixture
        uses: ./.github/actions/test-silo

      - name: Run integration tests
        run: make test-replication
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-replication
        name: Coverage Cache Replication
        with:
          path: |
            ./replication/coverage/
          key: ${{ runner.os }}-replication-coverage-2-${{ github.run_id }}

  sso-integration:
    name: SSO Integration Test with SILO
    needs: compile-binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare the coordinated SILO fixture
        uses: ./.github/actions/test-silo

      - name: Run integration tests
        run: make test-sso-integration
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-sso
        name: Coverage Cache SSO
        with:
          path: |
            ./sso-integration/coverage/
          key: ${{ runner.os }}-sso-coverage-2-${{ github.run_id }}

  coverage:
    name: Go coverage report
    needs:
      - b-integration-tests
      - test-api-on-go
      - test-pkg-on-go
      - sso-integration
      - replication
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check out gocovmerge as a nested repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: wadey/gocovmerge
          path: gocovmerge

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache
        name: Coverage Cache
        with:
          path: |
            ./integration/coverage/
          key: ${{ runner.os }}-coverage-2-${{ github.run_id }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-sso
        name: Coverage Cache SSO
        with:
          path: |
            ./sso-integration/coverage/
          key: ${{ runner.os }}-sso-coverage-2-${{ github.run_id }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-replication
        name: Coverage Cache Replication
        with:
          path: |
            ./replication/coverage/
          key: ${{ runner.os }}-replication-coverage-2-${{ github.run_id }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-api
        name: Coverage Cache API
        with:
          path: |
            ./api/coverage/
          key: ${{ runner.os }}-coverage-api-2-${{ github.run_id }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: coverage-cache-pkg
        name: Coverage Cache Pkg
        with:
          path: |
            ./pkg/coverage/
          key: ${{ runner.os }}-coverage-pkg-2-${{ github.run_id }}

      - name: Merge coverage and write reports
        working-directory: gocovmerge
        run: |
          go mod download golang.org/x/tools
          go mod tidy
          go build gocovmerge.go
          ./gocovmerge ../integration/coverage/system.out ../replication/coverage/replication.out ../sso-integration/coverage/sso-system.out ../api/coverage/coverage.out ../pkg/coverage/coverage-pkg.out > "$GITHUB_WORKSPACE/all.out"
          go tool cover -html="$GITHUB_WORKSPACE/all.out" -o "$GITHUB_WORKSPACE/all-coverage.html"
          go tool cover -func="$GITHUB_WORKSPACE/all.out" | tee "$GITHUB_WORKSPACE/coverage-summary.txt"
          tail -n 1 "$GITHUB_WORKSPACE/coverage-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-artifact
          path: |
            ./all.out
            ./all-coverage.html
            ./coverage-summary.txt
          if-no-files-found: error

  ui-assets-istanbul-coverage:
    name: "Assets with Istanbul Plugin for coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: web-app/yarn.lock
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: assets-cache-istanbul-coverage
        name: Assets Cache Istanbul Coverage
        with:
          path: |
            ./web-app/build/
          key: ${{ runner.os }}-assets-istanbul-coverage-${{ github.run_id }}
      - name: Install Dependencies
        working-directory: ./web-app
        run: |
          yarn install --immutable
      - name: Check for Warnings in build output
        working-directory: ./web-app
        run: |
          ./check-warnings-istanbul-coverage.sh

  compile-binary-istanbul-coverage:
    name: "Compile Console Binary with Istanbul Plugin for Coverage"
    needs:
      - lint-job
      - ui-assets-istanbul-coverage
      - semgrep-static-code-analysis
      - compile-binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Console Binary Cache Istanbul Coverage
        with:
          path: |
            ./console
          key: ${{ runner.os }}-binary-istanbul-coverage-${{ github.run_id }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: assets-cache-istanbul-coverage
        name: Assets Cache Istanbul Coverage
        with:
          path: |
            ./web-app/build/
          key: ${{ runner.os }}-assets-istanbul-coverage-${{ github.run_id }}
      - name: Run checks
        run: |
          make console

  cross-compile:
    name: Cross compile (${{ matrix.targets }})
    needs:
      - lint-job
      - ui-assets
      - semgrep-static-code-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targets:
          - linux/ppc64le linux/mips64
          - linux/arm64 linux/s390x
          - darwin/amd64 freebsd/amd64
          - windows/amd64 linux/arm
          - linux/386 netbsd/amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build target platforms
        env:
          TARGETS: ${{ matrix.targets }}
        run: bash cross-compile.sh "$TARGETS"

  playwright:
    needs:
      - compile-binary-istanbul-coverage
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: usage_test
          POSTGRES_PASSWORD: usage_test
          POSTGRES_DB: usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usage_test -d usage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CONSOLE_USAGE_DATABASE_URL: postgres://usage_test:usage_test@127.0.0.1:5432/usage_test?sslmode=disable
      CONSOLE_USAGE_UI_POLL_INTERVAL: 250ms
      CONSOLE_USAGE_POLL_INTERVAL: 100ms
      CONSOLE_USAGE_EVENT_DEBOUNCE: 100ms
      CONSOLE_USAGE_MIN_SCAN_INTERVAL: 0s
      CONSOLE_USAGE_RECONCILE_INTERVAL: 1s
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: web-app/yarn.lock

      - name: Install dependencies
        working-directory: web-app
        run: yarn install --immutable

      - name: Install Playwright Browsers
        working-directory: web-app
        run: yarn exec playwright install --with-deps chromium

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Console Binary Cache Istanbul Coverage
        with:
          path: |
            ./console
          key: ${{ runner.os }}-binary-istanbul-coverage-${{ github.run_id }}

      - name: Prepare the coordinated SILO fixture
        uses: ./.github/actions/test-silo

      - name: Initialize users/policies and start Console with its usage worker
        run: |
          set -euo pipefail
          make initialize-permissions
          CONSOLE_USAGE_S3_ACCESS_KEY=minioadmin CONSOLE_USAGE_S3_SECRET_KEY=minioadmin \
            CONSOLE_USAGE_HTTP_ADDRESS=127.0.0.1:19091 \
            ./console usage-worker > "$RUNNER_TEMP/playwright-usage-worker.log" 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19091/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/playwright-usage-worker.log"; exit 1; fi
          ./console server > "$RUNNER_TEMP/playwright-console.log" 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9090/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/playwright-console.log"; exit 1; fi

      - name: Run Playwright tests
        working-directory: web-app
        run: |
          yarn exec playwright test --reporter=github
          yarn exec nyc report

      - name: Verify group status and membership boundaries
        working-directory: web-app
        env:
          GROUP_STATUS_CONFIG: ${{ runner.temp }}/console-group-status.json
          GROUP_STATUS_ARTIFACTS: ${{ runner.temp }}/console-group-status-results
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.GROUP_STATUS_CONFIG, JSON.stringify({
            url: 'http://localhost:9090',
            root: { username: 'minioadmin', password: 'minioadmin' },
          }), { mode: 0o600 });
          NODE
          yarn exec playwright test --config=playwright.groups.config.ts

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-results
          path: web-app/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain group regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: group-status-results
          path: ${{ runner.temp }}/console-group-status-results
          if-no-files-found: warn

      - name: Retain Console and usage worker diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-service-logs
          path: |
            ${{ runner.temp }}/playwright-console.log
            ${{ runner.temp }}/playwright-usage-worker.log

  sharing-boundary:
    name: Shared downloads in standalone and embedded SILO
    needs:
      - compile-binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - name: Check out Console
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check out the maintained SILO fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: pgsty/silo
          ref: ${{ env.SILO_TEST_REVISION }}
          path: .sharing-silo
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: web-app/yarn.lock
      - name: Install browser dependencies
        working-directory: web-app
        run: |
          yarn install --immutable
          yarn exec playwright install --with-deps chromium
      - name: Restore the tested Console binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./console
          key: ${{ runner.os }}-binary-${{ github.run_id }}
      - name: Build SILO embedding this Console checkout
        working-directory: .sharing-silo
        run: |
          mc_version=$(go -C "$GITHUB_WORKSPACE" list -m -f '{{.Replace.Version}}' github.com/minio/mc)
          go mod edit -replace=github.com/minio/console="$GITHUB_WORKSPACE"
          go mod edit -replace="github.com/minio/mc=github.com/pgsty/mc@$mc_version"
          CGO_ENABLED=0 go build -mod=mod -o "$RUNNER_TEMP/sharing-silo" .
      - name: Check URL and HTTP boundaries with the race detector
        run: go test -race ./api -run '^TestSharedObject(URLScope|HTTPBoundary|Cancellation)$' -count=1
      - name: Verify real API and browser sharing in both deployments
        run: python3 hack/test-sharing-local.py --silo "$RUNNER_TEMP/sharing-silo" --console "$GITHUB_WORKSPACE/console" --output "$RUNNER_TEMP/sharing-results"
      - name: Retain sharing test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharing-results
          path: ${{ runner.temp }}/sharing-results
          if-no-files-found: warn

  usage-integration:
    name: Usage worker with PostgreSQL and maintained SILO
    needs:
      - compile-silo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: usage_test
          POSTGRES_PASSWORD: usage_test
          POSTGRES_DB: usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usage_test -d usage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Restore the maintained SILO fixture
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/silo-fixture/silo
          key: ${{ runner.os }}-silo-fixture-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Test leases, checkpoints, live events and caller permissions
        env:
          TEST_USAGE_DATABASE_URL: postgres://usage_test:usage_test@127.0.0.1:5432/usage_test?sslmode=disable
          TEST_USAGE_S3_ENDPOINT: http://127.0.0.1:19000
          TEST_USAGE_S3_ACCESS_KEY: usage-test-root
          TEST_USAGE_S3_SECRET_KEY: usage-test-disposable-secret
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/usage-data"
          MINIO_ROOT_USER="$TEST_USAGE_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$TEST_USAGE_S3_SECRET_KEY" MINIO_BROWSER=off \
            "$RUNNER_TEMP/silo-fixture/silo" server --address 127.0.0.1:19000 "$RUNNER_TEMP/usage-data" > "$RUNNER_TEMP/usage-silo.log" 2>&1 &
          silo_pid=$!
          trap 'kill "$silo_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent "$TEST_USAGE_S3_ENDPOINT/minio/health/live" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/usage-silo.log"; exit 1; fi
          # Native packages share one disposable storage endpoint and queue.
          # Keep their fixture lifetimes separate; concurrency within each
          # worker/lease test remains enabled under the race detector.
          go test -race -p 1 -tags=integration,storageintegration ./pkg/usage ./api -count=1 -timeout=10m
      - name: Retain storage fixture diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-storage-log
          path: ${{ runner.temp }}/usage-silo.log

  required-matrix:
    # Release workflows check this aggregate result. Upstream compatibility
    # remains advisory.
    name: Required matrix
    if: always()
    needs:
      - compile-silo
      - lint-job
      - downstream-embedder-compat
      - semgrep-static-code-analysis
      - ui-assets
      - swagger-codegen
      - compile-binary
      - release-artifacts
      - reproducible-artifacts
      - test-nginx-subpath
      - permissions-tests
      - test-pkg-on-go
      - test-api-on-go
      - b-integration-tests
      - replication
      - sso-integration
      - coverage
      - ui-assets-istanbul-coverage
      - compile-binary-istanbul-coverage
      - cross-compile
      - playwright
      - sharing-boundary
      - usage-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS" | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::required jobs did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
