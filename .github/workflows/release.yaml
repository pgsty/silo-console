name: goreleaser

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    contents: write
    packages: write

jobs:
    goreleaser:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Verify embedded web assets
              working-directory: web-app
              run: |
                  set -euo pipefail
                  corepack enable
                  yarn install --immutable
                  yarn build
                  ./optimize-embed.sh
                  git diff --exit-code -- build src/version.tsx

            - name: Verify clean checkout
              run: |
                  set -euo pipefail
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "Refusing to release from a dirty working tree:" >&2
                    git status --porcelain >&2
                    exit 1
                  fi

            - name: Login to ghcr.io
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
              with:
                  version: v2.17.1
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
