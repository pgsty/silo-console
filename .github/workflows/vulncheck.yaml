# @format

name: Vulnerability Check
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash

  react-code-known-vulnerabilities:
    name: "React Code Has No Known Vulnerable Deps"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked frontend dependencies
        working-directory: ./web-app
        run: yarn install --immutable
      - name: Check production dependencies for known security issues
        working-directory: ./web-app
        run: yarn npm audit --recursive --environment production --no-deprecations
      - name: Block high-severity issues in all dependency groups
        working-directory: ./web-app
        # GHSA-vfj7-8cjw-p6xm (npm 1240992): upstream braces 3.0.3 has no fixed release.
        # The Yarn patch bounds parse and AST walker nesting; dependency-security.unit.ts
        # checks malicious patterns, AST inputs, and normal build/test globs. npm audit
        # cannot detect patches. Keep this exact development-only exception until an
        # upstream fix replaces the patch; production audit remains unfiltered.
        run: yarn npm audit --recursive --severity high --no-deprecations --ignore 1240992

  required-vulnerability-checks:
    name: Required vulnerability checks
    if: always()
    needs:
      - vulncheck
      - react-code-known-vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS" | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::required jobs did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
