# @format

name: Vulnerability Check
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash

  react-code-known-vulnerabilities:
    name: "React Code Has No Known Vulnerable Deps"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Read .nvmrc
        id: node_version
        run: echo "$(cat .nvmrc)" && echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_ENV
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NVMRC }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked frontend dependencies
        working-directory: ./web-app
        run: yarn install --immutable
      - name: Check production dependencies for known security issues
        working-directory: ./web-app
        continue-on-error: false
        run: yarn npm audit --recursive --environment production --no-deprecations
      - name: Block high-severity issues in all dependency groups
        working-directory: ./web-app
        continue-on-error: false
        run: yarn npm audit --recursive --severity high --no-deprecations
