name: Promote published image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: silo-console-latest
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published version before advancing latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          jq -e '.draft == false and .prerelease == false' <<<"$release"
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$TAG" != "$latest" ]; then
            echo "This is not the current GitHub release; latest is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/$TAG"
          issuer="https://token.actions.githubusercontent.com"
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image@$digest"
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image@$digest"
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY"
          mkdir verification
          gh release download "$TAG" --dir verification --pattern '*_checksums.txt*'
          for checksum in verification/*_checksums.txt; do
            cosign verify-blob --bundle "${checksum}.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$checksum"
            gh attestation verify "$checksum" --repo "$GITHUB_REPOSITORY"
          done
          # Empty Docker credentials ensure public access is actually tested.
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image@$digest" >/dev/null
          rm -rf "$anonymous_config"
          # Recheck after verification, in case another release was published.
          test "$TAG" = "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          docker buildx imagetools create --tag "$image:latest" "$image@$digest"
          test "$digest" = "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          echo "Public latest now points to the verified $TAG image: $digest" >> "$GITHUB_STEP_SUMMARY"
