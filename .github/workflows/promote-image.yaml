name: Promote published image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: silo-console-latest
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify the published version before advancing latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          jq -e '.draft == false and .prerelease == false' <<<"$release"
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$TAG" != "$latest" ]; then
            echo "This is not the current GitHub release; latest is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image="docker.io/${GITHUB_REPOSITORY}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/$TAG"
          issuer="https://token.actions.githubusercontent.com"
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # The packaging workflow signs on main; bind its signed image to this
          # release so a retagged image from another version cannot be promoted.
          docker buildx imagetools inspect "$image@$digest" --raw \
            | jq -e --arg tag "$TAG" '.annotations["org.opencontainers.image.version"] == $tag'
          checksum_identity="$identity"
          if ! cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image@$digest"; then
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yaml@refs/heads/main"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image@$digest"
          fi
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image@$digest"
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity"
          mkdir verification
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verification --pattern '*_checksums.txt*'
          for checksum in verification/*_checksums.txt; do
            cosign verify-blob --bundle "${checksum}.sigstore.json" --certificate-identity "$checksum_identity" --certificate-oidc-issuer "$issuer" "$checksum"
            gh attestation verify "$checksum" --repo "$GITHUB_REPOSITORY"
          done
          # Empty Docker credentials ensure public access is actually tested.
          anonymous_config=$(mktemp -d)
          for platform in linux/amd64 linux/arm64; do
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "$platform" "$image@$digest" >/dev/null
          done
          rm -rf "$anonymous_config"
          # Recheck after verification, in case another release was published.
          test "$TAG" = "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          docker buildx imagetools create --tag "$image:latest" "$image@$digest"
          test "$digest" = "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          echo "Public latest now points to the verified $TAG image: $digest" >> "$GITHUB_STEP_SUMMARY"
