name: Publish image from signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: silo-console-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      IMAGE: docker.io/pgsty/silo-console
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Verify the published inputs
        run: hack/stage-published-image.sh "$TAG" "$RUNNER_TEMP/image-context"
      - name: Build the versioned image without replacing an existing version
        id: image
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            echo "::error::The versioned image already exists; refusing to overwrite it."
            exit 1
          fi
          grep -Eiq 'manifest unknown|no such manifest|not found' "$RUNNER_TEMP/manifest-error"
          context="$RUNNER_TEMP/image-context"
          commit=$(jq -r .commit "$context/release-inputs.json")
          epoch=$(jq -r .epoch "$context/release-inputs.json")
          created=$(jq -r .created "$context/release-inputs.json")
          docker buildx build "$context" --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$TAG" --build-arg "TAG=$TAG" --build-arg "SOURCE_DATE_EPOCH=$epoch" \
            --label "org.opencontainers.image.revision=$commit" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.created=$created" \
            --label "io.pgsty.silo-console.source=https://github.com/$GITHUB_REPOSITORY/tree/$TAG" \
            --annotation "index:org.opencontainers.image.revision=$commit" \
            --annotation "index:org.opencontainers.image.version=$TAG" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:io.pgsty.silo-console.source=https://github.com/$GITHUB_REPOSITORY/tree/$TAG" \
            --provenance=false --push --metadata-file "$RUNNER_TEMP/image-metadata.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$IMAGE@$digest"
          syft scan "registry:$IMAGE@$digest" -o spdx-json="$RUNNER_TEMP/image.spdx.json" --quiet
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/image.spdx.json" "$IMAGE@$digest"
          # Record the packaging workflow separately from the signed release inputs.
          jq --arg repo "$GITHUB_REPOSITORY" --arg workflow_sha "$GITHUB_SHA" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '
            {buildDefinition:{
              buildType:"https://github.com/pgsty/silo-console/blob/main/.github/workflows/publish-image.yaml",
              externalParameters:{tag:.tag},
              internalParameters:{workflowCommit:$workflow_sha},
              resolvedDependencies:[
                {uri:("git+https://github.com/"+$repo+"@refs/tags/"+.tag),digest:{gitCommit:.commit}},
                {uri:("https://github.com/"+$repo+"/releases/download/"+.tag+"/"+.checksum),digest:{sha256:.checksum_digest}}
              ]},runDetails:{builder:{id:"https://github.com/actions/runner/github-hosted"},metadata:{invocationId:$invocation}}}' \
            "$context/release-inputs.json" > "$RUNNER_TEMP/image-provenance.json"
      - name: Attest the image and its signed release inputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/image-provenance.json
          push-to-registry: true
      - name: Verify public image delivery
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-image.yaml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST"
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity"
          anonymous_config=$(mktemp -d)
          for platform in linux/amd64 linux/arm64; do
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "$platform" "$IMAGE@$DIGEST" >/dev/null
          done
          rm -rf "$anonymous_config"
          gh release upload "$TAG" "$RUNNER_TEMP/image.spdx.json" --clobber
          echo "Verified public $IMAGE:$TAG at $DIGEST. Run promote-image.yaml with tag=$TAG to advance latest after its release checks." >> "$GITHUB_STEP_SUMMARY"
