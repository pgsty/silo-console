# Make sure to check the documentation at http://goreleaser.com
version: 2
project_name: silo-console

release:
  name_template: "Release version {{.Tag}}"
  github:
    owner: pgsty
    name: silo-console
  # Keep GitHub release metadata in draft until verification is complete.
  draft: true
  replace_existing_artifacts: true
  prerelease: false
  extra_files:
    - glob: LICENSE
    - glob: NOTICE
    - glob: CREDITS

before:
  hooks:
    - go mod download
    - go mod verify
    - python3 hack/normalize-package-inputs.py

builds:
  - goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./cmd/console/
    flags:
      - -trimpath
      - --tags=kqueue,operator
    ldflags:
      - -s -w -X github.com/minio/console/pkg.ReleaseTag={{.Tag}} -X github.com/minio/console/pkg.CommitID={{.FullCommit}} -X github.com/minio/console/pkg.Version={{.Version}} -X github.com/minio/console/pkg.ShortCommitID={{.ShortCommit}} -X github.com/minio/console/pkg.ReleaseTime={{.CommitDate}}

archives:
  # Bare executables keep their historical asset names; each executable also
  # embeds LICENSE, NOTICE and CREDITS (`console license|notice|credits`).
  - id: binaries
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: ["binary"]
  # Bundles carry the same executable together with the legal material as files.
  - id: bundles
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - src: LICENSE
        info: { owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: NOTICE
        info: { owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: CREDITS
        info: { owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}" }

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  # Must be a valid deb/rpm/apk version so snapshot packages can be inspected
  # exactly like release packages (hack/verify-release-artifacts.sh).
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - mtime: "{{ .CommitDate }}"
    vendor: PGSTY
    homepage: https://silo.pgsty.com
    maintainer: "Ruohang Feng (@Vonng) <rh@vonng.com>"
    description: SILO object storage console, community-maintained MinIO Console fork.
    license: AGPL-3.0-or-later
    section: utils
    priority: optional
    bindir: /usr/local/bin
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/silo-console/LICENSE
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: NOTICE
        dst: /usr/share/licenses/silo-console/NOTICE
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: CREDITS
        dst: /usr/share/doc/silo-console/CREDITS
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: packaging/debian/copyright
        dst: /usr/share/doc/silo-console/copyright
        packager: deb
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      # DEB/RPM packages retain the compatibility unit name, see systemd/README.md
      - src: systemd/console.service
        dst: /etc/systemd/system/minio-console.service
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
          owner: root
          group: root
      - src: systemd/console.env
        dst: /etc/default/console
        type: config|noreplace
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0600
          owner: root
          group: root
      - dst: /var/lib/silo-console
        type: dir
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0750
          owner: console-user
          group: console-user
      - dst: /etc/silo-console/certs/CAs
        type: dir
        file_info:
          mtime: "{{ .CommitDate }}"
          mode: 0750
          owner: root
          group: console-user
    # Stock Alpine has no systemd. A single APK account-creation hook also
    # avoids nFPM's nondeterministic map iteration for multiple APK scripts.
    scripts:
      preinstall: systemd/preinstall.sh
    overrides:
      deb:
        scripts:
          postinstall: systemd/reload.sh
          postremove: systemd/reload.sh
          preremove: systemd/preremove.sh
      rpm:
        scripts:
          postinstall: systemd/reload.sh
          postremove: systemd/reload.sh
          preremove: systemd/preremove.sh
    rpm:
      group: Applications/File
      compression: gzip:9
    deb:
      compression: gzip
      fields:
        License: AGPL-3.0-or-later

dockers_v2:
  # Release images go directly to the public package. Snapshot tags stay local
  # and include the commit so the artifact verifier cannot reuse a stale image.
  - dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/pgsty/silo-console"
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if .IsSnapshot }}snapshot-{{ .ShortCommit }}{{ else }}{{ .Tag }}{{ end }}"
    build_args:
      TAG: "{{ .Tag }}"
      SOURCE_DATE_EPOCH: "{{ .CommitTimestamp }}"
    extra_files:
      - LICENSE
      - NOTICE
      - CREDITS
    labels:
      "org.opencontainers.image.authors": "Pigsty"
      "org.opencontainers.image.vendor": "Pigsty"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "The SILO object storage console; AGPL-3.0-or-later, license and attribution in /usr/share/licenses/silo-console"
      "org.opencontainers.image.created": "{{.CommitDate}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}"
      "org.opencontainers.image.url": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.documentation": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.source": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.licenses": "AGPL-3.0-or-later"
      "org.opencontainers.image.base.name": "scratch"
      "io.pgsty.silo-console.source": "{{ if .IsSnapshot }}https://github.com/pgsty/silo-console/commit/{{ .FullCommit }}{{ else }}https://github.com/pgsty/silo-console/tree/{{ .Tag }}{{ end }}"
    annotations:
      "org.opencontainers.image.authors": "Pigsty"
      "org.opencontainers.image.vendor": "Pigsty"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "The SILO object storage console; AGPL-3.0-or-later, license and attribution in /usr/share/licenses/silo-console"
      "org.opencontainers.image.created": "{{.CommitDate}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}"
      "org.opencontainers.image.url": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.documentation": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.source": "https://github.com/pgsty/silo-console"
      "org.opencontainers.image.licenses": "AGPL-3.0-or-later"
      "org.opencontainers.image.base.name": "scratch"
      "io.pgsty.silo-console.source": "{{ if .IsSnapshot }}https://github.com/pgsty/silo-console/commit/{{ .FullCommit }}{{ else }}https://github.com/pgsty/silo-console/tree/{{ .Tag }}{{ end }}"

# Keyless identities bind the release workflow and tag; no signing key is stored.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle", "${signature}", "${artifact}"]

docker_signs:
  - cmd: cosign
    artifacts: all
    args: ["sign", "--yes", "${artifact}"]

sboms:
  - id: binary-sbom
    artifacts: binary
    ids: [binaries]
    cmd: bash
    args: ["../hack/generate-sbom.sh", "${artifact}", "${document}"]
    documents: ["{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}.spdx.json"]
  - id: package-sbom
    artifacts: package
    cmd: bash
    args: ["../hack/generate-sbom.sh", "${artifact}", "${document}"]
    documents: ["${artifact}.spdx.json"]

  - id: source-sbom
    artifacts: source
    cmd: bash
    args: ["../hack/generate-sbom.sh", "${artifact}", "${document}"]
    documents: ["${artifact}.spdx.json"]

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
