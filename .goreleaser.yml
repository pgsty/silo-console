# Make sure to check the documentation at http://goreleaser.com
version: 2
project_name: silo-console

release:
  name_template: "Release version {{.Tag}}"
  github:
    owner: pgsty
    name: silo-console
  draft: true
  prerelease: false

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
    env:
      - CGO_ENABLED=0
    main: ./cmd/console/
    flags:
      - -trimpath
      - --tags=kqueue,operator
    ldflags:
      - -s -w -X github.com/minio/console/pkg.ReleaseTag={{.Tag}} -X github.com/minio/console/pkg.CommitID={{.FullCommit}} -X github.com/minio/console/pkg.Version={{.Version}} -X github.com/minio/console/pkg.ShortCommitID={{.ShortCommit}} -X github.com/minio/console/pkg.ReleaseTime={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: ["binary"]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: SNAPSHOT@{{.ShortCommit}}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - vendor: PGSTY
    homepage: https://silo.pgsty.com
    maintainer: "Ruohang Feng (@Vonng) <rh@vonng.com>"
    description: SILO object storage console, community-maintained MinIO Console fork.
    license: AGPL-3.0-or-later
    section: utils
    priority: optional
    bindir: /usr/local/bin
    formats:
      - deb
      - rpm
      - apk
    contents:
      # DEB/RPM packages retain the compatibility unit name, see systemd/README.md
      - src: systemd/console.service
        dst: /etc/systemd/system/minio-console.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: systemd/console.env
        dst: /etc/default/console
        type: config|noreplace
        file_info:
          mode: 0600
          owner: root
          group: root
    scripts:
      preinstall: systemd/preinstall.sh
    rpm:
      group: Applications/File
      compression: gzip:9
    deb:
      compression: gzip
      fields:
        License: AGPL-3.0-or-later

dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/pgsty/silo-console"
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      - "latest"
    build_args:
      TAG: "{{ .Tag }}"
    labels:
      "org.opencontainers.image.authors": "Pigsty"
      "org.opencontainers.image.vendor": "Pigsty"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "The SILO object storage console"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Tag}}"
      "org.opencontainers.image.url": "{{.GitURL}}"
      "org.opencontainers.image.documentation": "{{.GitURL}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.licenses": "AGPL-3.0-or-later"
      "org.opencontainers.image.base.name": "scratch"
    annotations:
      "org.opencontainers.image.authors": "Pigsty"
      "org.opencontainers.image.vendor": "Pigsty"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "The SILO object storage console"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Tag}}"
      "org.opencontainers.image.url": "{{.GitURL}}"
      "org.opencontainers.image.documentation": "{{.GitURL}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.licenses": "AGPL-3.0-or-later"
      "org.opencontainers.image.base.name": "scratch"
